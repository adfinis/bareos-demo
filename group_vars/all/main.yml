---

# we only use one director
bareos_director: expert-circle-alicea

# only needs to be adjusted for clients if public DNS resolution is not possible for some reason
bareos_director_address: 192.168.0.4

bareos_group: Expert_Circle
bareos_dir_group_password: iekVnwhuk4zghseYWhtFcmLrbyseqaXn4yVqsikawL47LMVeRq

# always use the ZFS storage on the chosen Storage Daemon
bareos_storage: "Storage_{{ bareos_storagedaemon }}"

# naming the Bareos customer-specific resources
bareos_job_prefix: "Job_{{ bareos_group }}"  # will be appended per client with "_{{ inventory_hostname }}"
bareos_pool_prefix: "Pool_{{ bareos_group }}"
bareos_message: "Messages_{{ bareos_group }}"

# these lists have to be defined here, to add items later
bareos_dir_jobs: []
bareos_dir_clients: []

# avoid overwrite of director master config
bareos_dir_overwrite_dir_conf: false

# default settings that are applied for all regular hosts which do not have their own `bareos_fd_jobs` defined.
# for example all DB hosts need their own settings and can therefore use different
# settings like a different Bareos pool or schedule

job_defaults:
  name: "{{ bareos_job_prefix }}_Daily_AlwaysIncremental"
  always_incremental: true  # https://docs.bareos.org/TasksAndConcepts/AlwaysIncrementalBackupScheme.html#always-incremental-concept
  pool: "{{ bareos_pool_prefix }}_AI_Incremental"
  full_backup_pool: "{{ bareos_pool_prefix }}_AI_Consolidated"
  messages: "{{ bareos_message }}"
  jobdefs: JobDef_AlwaysIncremental  # defined globally
  schedule: "{{ bareos_schedule }}"
  storage: "{{ bareos_storage }}"

  # values are already set on JobDef_AlwaysIncremental but this makes them overwritable on bareos_group level
  always_incremental_job_retention: "{{ ai_inc_job_retention | default(omit) }}"
  always_incremental_keep_number: "{{ ai_inc_keep_number | default(omit) }}"
  always_incremental_max_full_age: "{{ ai_max_full_age | default(omit) }}"

client_defaults:
  address: "" # leave empty as filedaemons initiate TCP connection to director
  password: "{{ bareos_group_password }}"
  maximum_concurrent_jobs: 1
  enabled: true
  connection_from_fd: true
  connection_from_dir: false
  heartbeat: 60

