---


bareos_storagedaemon: expert-circle-bobb
bareos_schedule: Daily0200_Incremental

# use defaults from group_vars/all rather than overwriting them
bareos_fd_jobs_append: true

bareos_fd_plugins:
  - postgresql

# overwrite bareos_fd_jobs to add a secondary job for the database backups
bareos_fd_jobs:
  - name: "{{ bareos_job_prefix }}_PostgreSQL_{{ inventory_hostname }}"
    client: "{{ inventory_hostname }}"
    incremental_backup_pool: "{{ bareos_pool_prefix }}_DB_Incremental"
    pool: "{{ bareos_pool_prefix }}_DB_Incremental"
    full_backup_pool: "{{ bareos_pool_prefix }}_DB_Full"
    max_full_interval: 5 days  # makes sure we have a full backup at least every 5 days
    jobdefs: JobDef_PostgreSQL_Backup
    level: Incremental  # level will be overwritten by max_full_interval
    schedule: "{{ bareos_schedule_postgresql | default(bareos_schedule) }}"
    storage: "{{ bareos_storage }}"
    messages: "{{ bareos_message }}"
    client_runbeforejob: /usr/local/bin/bareos-psql-before.sh
    client_runafterjob: /usr/local/bin/bareos-psql-after.sh

# will spawn a before and after script that cleanes up old files
# in the PostgreSQL WAL archive directory
bareos_fd_plugin_psql_wal_cleanup_enable: true
