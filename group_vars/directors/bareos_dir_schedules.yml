---

bareos_dir_schedules:
  - name: WeeklyCycle
    run:
      - "Full 1st sun at 21:00"
      - "Differential 2nd-5th sun at 21:00"
      - "Incremental mon-sat at 21:00"

  - name: HourlyIncremental
    description: >-
      Run an incremental backup every half hour
    run:
      - "Level=Incremental hourly at 00:30"

  - name: HourlyDatabase_Incremental
    description: >-
      Run an incremental database backup every full hour
    run:
      - "Level=Incremental hourly at 00:00"

  - name: Weekend_Full
    description: >-
      Weekend full backup, starting on Saturday 0200
    run:
      - "Level=Full sat at 02:00"

